name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar mingw-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 mingw-w64-tools

      - name: Compilar
        run: ./build.sh

      - name: Probar el mallador con las muestras
        run: |
          python3 tests/make_samples.py tests/samples
          for f in caja placa_agujero eje; do
            ./build/steprender "tests/samples/$f.stp" "/tmp/$f.bmp" 256 | tee "/tmp/$f.log"
            grep -q "fallidas 0" "/tmp/$f.log"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: stp-viewer-windows-x64
          path: dist/

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
